    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }

    @media (max-width: 767px) {
      .mobile-sidebar-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
      }
      .mobile-sidebar-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .mobile-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 280px;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 250ms cubic-bezier(0.33, 1, 0.68, 1);
        background: #f6f8fa;
        border-right: 1px solid #d1d9e0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .mobile-sidebar.open {
        transform: translateX(0);
      }
      /* Mobile README overlay */
      .mobile-readme-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: #fff;
        transform: translateX(100%);
        transition: transform 250ms cubic-bezier(0.33, 1, 0.68, 1);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .mobile-readme-overlay.open {
        transform: translateX(0);
      }
      /* Hide desktop sidebar on mobile */
      .desktop-sidebar { display: none !important; }
      /* Hide desktop readme panel on mobile */
      .desktop-readme { display: none !important; }
      /* Mobile: repo list always full width */
      .repo-list-panel { width: 100% !important; min-width: 0 !important; }
      /* Better touch targets on mobile */
      .mobile-touch-target { min-height: 44px; }
    }
    @media (min-width: 768px) {
      .mobile-sidebar, .mobile-sidebar-backdrop, .mobile-readme-overlay, .mobile-menu-btn { display: none !important; }
    }

    /* Tag pill */
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 0 7px;
      height: 20px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 9999px;
      background: #ddf4ff;
      color: #0969da;
      border: 1px solid #b6e3ff;
      white-space: nowrap;
      line-height: 1;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(31, 35, 40, 0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 150ms ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-panel {
      background: #fff;
      border: 1px solid #d1d9e0;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
      width: 520px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      animation: scaleIn 150ms ease;
    }
    @keyframes scaleIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Tag picker popover */
    .tag-picker-popover {
      background: #fff;
      border: 1px solid #d1d9e0;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
      z-index: 60;
      max-height: 400px;
      display: flex;
      flex-direction: column;
      animation: fadeIn 100ms ease;
    }

    /* Tag toggle item in picker */
    .tag-toggle-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 80ms;
      font-size: 13px;
      line-height: 1.3;
    }
    .tag-toggle-item:hover {
      background: #f6f8fa;
    }
    .tag-toggle-check {

      height: 16px;
      border-radius: 4px;
      border: 1.5px solid #d1d9e0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 80ms;

    /* Skeleton animation */
    @keyframes shimmer {
      0% { background-position: -200px 0; }
      100% { background-position: 200px 0; }

      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);

        min-height: 36px;
        font-size: 13px;
      }
    }

    // ── Toast Component ────────────────────────────────────────────────────────
    function Toast({ message, type = 'info', onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 3000);
        return () => clearTimeout(t);
      }, [onClose]);

      const bgMap = { success: 'bg-gh-successSubtle border-gh-success text-gh-success', error: 'bg-gh-dangerSubtle border-gh-danger text-gh-danger', info: 'bg-gh-warningSubtle border-gh-warning text-gh-warning' };

    // ── Icon Components ────────────────────────────────────────────────────────
    function StarIcon({ filled, size = 16 }) {

        <svg width={size} height={size} viewBox="0 0 16 16" fill="#e3b341" stroke="#e3b341" strokeWidth="1"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
      ) : (
        <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="#656d76" strokeWidth="1"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>

          <path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 1.5A5.485 5.485 0 0 0 2.47 3.79l1.204 1.204A.25.25 0 0 1 3.5 5.42H.094a.25.25 0 0 1-.25-.25V1.529a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 1.5Z"/>
        </svg>
      );
    }

    function SearchIcon() {
      return <svg width="16" height="16" viewBox="0 0 16 16" fill="#656d76"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>;
    }

    function CloseIcon() {
      return <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>;
    }

    function HamburgerIcon() {
      return <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>;
    }

    function EditIcon() {
      return <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Zm.176 4.823L9.75 4.81l-6.286 6.287a.253.253 0 0 0-.064.108l-.558 1.953 1.953-.558a.253.253 0 0 0 .108-.064Zm1.238-3.763a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354Z"/></svg>;

    function NoteIcon() {
      return <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25V8.5h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>;
    }

    function ChevronIcon({ open }) {
      return (
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" style={{ transform: open ? 'rotate(0)' : 'rotate(-90deg)', transition: 'transform 150ms ease' }}>
          <path d="M12.78 6.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 7.28a.749.749 0 1 1 1.06-1.06L8 9.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/>
        </svg>
      );
    }

    function TrashIcon() {
      return <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11 1.75V3h2.25a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1 0-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75ZM4.496 6.675l.66 6.6a.25.25 0 0 0 .249.225h5.19a.25.25 0 0 0 .249-.225l.66-6.6a.75.75 0 0 1 1.492.149l-.66 6.6A1.748 1.748 0 0 1 10.595 15h-5.19a1.75 1.75 0 0 1-1.741-1.575l-.66-6.6a.75.75 0 1 1 1.492-.15ZM6.5 1.75V3h3V1.75a.25.25 0 0 0-.25-.25h-2.5a.25.25 0 0 0-.25.25Z"/></svg>;
    }

    function ExternalIcon() {
      return <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.854-1h4.146a.25.25 0 0 1 .25.25v4.146a.25.25 0 0 1-.427.177L13.03 4.03 9.28 7.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.75-3.75-1.543-1.543A.25.25 0 0 1 10.604 1Z"/></svg>;
    }

    function TagManageIcon() {
      return <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.752 1.752 0 0 1 1 7.775Zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25ZM6 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>;
    }

    function PlusIcon({ size = 12 }) {
      return <svg width={size} height={size} viewBox="0 0 16 16" fill="currentColor"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/></svg>;
    }

    function CheckIcon() {
      return <svg width="10" height="10" viewBox="0 0 16 16" fill="white"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>;
    }

    // ── Sidebar Category Nav ───────────────────────────────────────────────────
    function CategoryNav({ categories, activeFilter, onSelectFilter, repoCounts, collapsedCats, onToggleCat, onOpenTagManager, repos }) {
      const totalRepos = Object.values(repoCounts).reduce((a, b) => a + b, 0);
      const untaggedCount = repos.filter(r => !r.tags || r.tags.length === 0).length;

      const isActive = (key) => activeFilter === key;

      return (
        <div className="flex flex-col h-full">
          <div className="px-3 py-3 border-b border-gh-borderMuted">
            <div className="flex items-center gap-2 mb-3">
              <button className="flex items-center justify-center w-8 h-8 rounded-md hover:bg-gh-canvas transition-colors" title="同步 Star 数据">
                <SyncIcon spinning={false} />
              </button>
              <div className="flex items-center gap-2 flex-1 min-w-0">
                <img src={MOCK_USER.avatar_url} alt="" className="w-7 h-7 rounded-full border border-gh-border" />
                <span className="text-xs font-medium text-gh-fgMuted truncate">{MOCK_USER.login}</span>
              </div>
            </div>
            <div className="relative">
              <div className="absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"><SearchIcon /></div>
              <input
                type="text"
                placeholder="搜索仓库..."
                className="gh-input pl-8 text-xs"
                style={{ height: 28 }}
              />
            </div>
          </div>

          <div className="flex-1 overflow-y-auto py-1">
            {/* All */}
            <button
              onClick={() => onSelectFilter('all')}
              className={`w-full flex items-center justify-between px-3 py-1.5 text-sm hover:bg-gh-canvas transition-colors ${isActive('all') ? 'bg-gh-accent text-white hover:bg-gh-accentEmphasis font-medium' : 'text-gh-fg'}`}
              style={{ borderRadius: 0 }}
            >
              <span className="flex items-center gap-2">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" className={isActive('all') ? 'text-white' : 'text-gh-fgMuted'}><path d="M1.5 1.75V13.5h13.25a.75.75 0 0 1 0 1.5H.75a.75.75 0 0 1-.75-.75V1.75a.75.75 0 0 1 1.5 0Zm14.28 2.53-5.25 5.25a.75.75 0 0 1-1.06 0L7 7.06 4.28 9.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.25-3.25a.75.75 0 0 1 1.06 0L10 7.94l4.72-4.72a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042Z"/></svg>
                全部
              </span>
              <span className={`text-xs ${isActive('all') ? 'text-white/70' : 'text-gh-fgMuted'}`}>{totalRepos}</span>
            </button>

            {/* Untagged */}
            <button
              onClick={() => onSelectFilter('untagged')}
              className={`w-full flex items-center justify-between px-3 py-1.5 text-sm hover:bg-gh-canvas transition-colors ${isActive('untagged') ? 'bg-gh-accent text-white hover:bg-gh-accentEmphasis font-medium' : 'text-gh-fg'}`}
              style={{ borderRadius: 0 }}
            >
              <span className="flex items-center gap-2">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" className={isActive('untagged') ? 'text-white' : 'text-gh-fgMuted'}><path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.752 1.752 0 0 1 1 7.775Zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25ZM6 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>
                未分类
              </span>
              <span className={`text-xs ${isActive('untagged') ? 'text-white/70' : 'text-gh-fgMuted'}`}>{untaggedCount}</span>
            </button>

            <div className="h-px bg-gh-borderMuted my-1" />

            {/* Categories */}
            {categories.map(cat => {
              const isOpen = !collapsedCats.includes(cat.id);
              const catRepoCount = cat.tags.reduce((sum, t) => sum + (repoCounts[t.id] || 0), 0);
              return (
                <div key={cat.id}>
                  <button
                    onClick={() => { onToggleCat(cat.id); onSelectFilter('cat:' + cat.id); }}
                    className={`w-full flex items-center justify-between px-3 py-1.5 text-sm hover:bg-gh-canvas transition-colors ${activeFilter === 'cat:' + cat.id ? 'bg-gh-canvas font-semibold text-gh-fg' : 'text-gh-fg'}`}
                    style={{ borderRadius: 0 }}
                  >
                    <span className="flex items-center gap-1.5">
                      <ChevronIcon open={isOpen} />
                      <span className="truncate text-xs">{cat.name}</span>
                    </span>
                    <span className="text-xs text-gh-fgMuted flex-shrink-0">{catRepoCount}</span>
                  </button>
                  {isOpen && cat.tags.map(tag => (
                    <button
                      key={tag.id}
                      onClick={() => onSelectFilter('tag:' + tag.id)}
                      className={`w-full flex items-center justify-between pl-8 pr-3 py-1 text-sm hover:bg-gh-canvas transition-colors ${activeFilter === 'tag:' + tag.id ? 'bg-gh-accent text-white font-medium' : 'text-gh-fg'}`}
                      style={{ borderRadius: 0 }}
                    >
                      <span className="truncate text-xs">{tag.name}</span>
                      <span className={`text-xs flex-shrink-0 ${activeFilter === 'tag:' + tag.id ? 'text-white/70' : 'text-gh-fgMuted'}`}>{repoCounts[tag.id] || 0}</span>
                    </button>
                  ))}
                </div>
              );
            })}

            <div className="h-px bg-gh-borderMuted my-1" />

            {/* Manage Tags */}
            <button
              onClick={onOpenTagManager}
              className="w-full flex items-center gap-2 px-3 py-1.5 text-xs text-gh-fgMuted hover:text-gh-accent hover:bg-gh-canvas transition-colors"
              style={{ borderRadius: 0 }}
            >
              <TagManageIcon />
              管理标签...
            </button>

            <div className="h-px bg-gh-borderMuted my-1" />

            {/* Trash */}
            <button
              onClick={() => onSelectFilter('trash')}
              className={`w-full flex items-center justify-between px-3 py-1.5 text-sm hover:bg-gh-canvas transition-colors ${isActive('trash') ? 'bg-gh-accent text-white hover:bg-gh-accentEmphasis font-medium' : 'text-gh-fg'}`}
              style={{ borderRadius: 0 }}
            >
              <span className="flex items-center gap-2">
                <TrashIcon />
                回收站
              </span>
              <span className={`text-xs ${isActive('trash') ? 'text-white/70' : 'text-gh-fgMuted'}`}>0</span>
            </button>
          </div>
        </div>
      );
    }

    // ── Repo Card ──────────────────────────────────────────────────────────────
    function RepoCard({ repo, isSelected, onClick, categories, onToggleTag, onCreateTag }) {
      const [editingNote, setEditingNote] = useState(false);
      const [noteText, setNoteText] = useState(repo.note || '');
      const [showTagPicker, setShowTagPicker] = useState(false);
      const tagAreaRef = useRef(null);

      const tagNames = (repo.tags || []).map(tagId => {
        for (const cat of categories) {
          const found = cat.tags.find(t => t.id === tagId);
          if (found) return { id: tagId, name: found.name };
        }
        return { id: tagId, name: tagId };
      });

      return (
        <div
          onClick={onClick}
          className={`group border-b border-gh-borderMuted cursor-pointer transition-colors ${isSelected ? 'bg-gh-accent/5 border-l-2 !border-l-gh-accent' : 'hover:bg-gh-canvas/60 border-l-2 border-l-transparent'}`}
          style={{ padding: '12px 12px 10px' }}
        >
          {/* Header row */}
          <div className="flex items-start justify-between gap-2 mb-1">
            <div className="min-w-0 flex-1">
              <span className="text-sm font-semibold text-gh-accent hover:underline truncate block">
                {repo.full_name}
              </span>
            </div>
            <div className="flex items-center gap-0.5 flex-shrink-0">
              <button
                onClick={(e) => { e.stopPropagation(); }}
                className="p-1.5 sm:p-0.5 rounded hover:bg-gh-canvasSubtle transition-colors"
                title="取消 Star"
                style={{ minWidth: 32, minHeight: 32, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
              >
                <StarIcon filled={true} size={14} />
              </button>
              <button
                onClick={(e) => { e.stopPropagation(); setShowTagPicker(!showTagPicker); }}
                className="p-1.5 sm:p-0.5 rounded hover:bg-gh-canvasSubtle transition-colors text-gh-fgMuted hover:text-gh-fg"
                title="编辑标签"
                style={{ minWidth: 32, minHeight: 32, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
              >
                <EditIcon />
              </button>
              <button
                onClick={(e) => { e.stopPropagation(); setEditingNote(!editingNote); }}
                className="p-1.5 sm:p-0.5 rounded hover:bg-gh-canvasSubtle transition-colors text-gh-fgMuted hover:text-gh-fg"
                title="编辑备注"
                style={{ minWidth: 32, minHeight: 32, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
              >
                <NoteIcon />
              </button>
            </div>
          </div>

          {/* Description */}
          {repo.description && (
            <p className="text-xs text-gh-fgMuted leading-relaxed mb-1.5" style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
              {repo.description}
            </p>
          )}

          {/* Meta row */}
          <div className="flex items-center gap-3 text-xs text-gh-fgMuted mb-1.5 flex-wrap">
            {repo.language && (
              <span className="flex items-center gap-1">
                <span className="inline-block w-2.5 h-2.5 rounded-full" style={{ background: getLanguageColor(repo.language) }} />
                {repo.language}
              </span>
            )}
            <span className="flex items-center gap-0.5">
              <StarIcon filled={false} size={12} />
              {formatStars(repo.stargazers_count)}
            </span>
            <span>更新: {repo.updated_at}</span>
          </div>

          {/* Starred time */}
          <div className="text-xs text-gh-fgMuted/60 mb-1.5">
            Starred: {repo.starred_at}
          </div>

          {/* Tags */}
          <div className="flex items-center gap-1 flex-wrap relative" ref={tagAreaRef}>
            {tagNames.map(t => (
              <span key={t.id} className="tag-pill">{t.name}</span>
            ))}
            <button
              onClick={(e) => { e.stopPropagation(); setShowTagPicker(!showTagPicker); }}
              className="inline-flex items-center gap-0.5 text-xs text-gh-accent hover:underline"
            >
              + 添加标签
            </button>
            {/* Tag picker popover */}
            {showTagPicker && ReactDOM.createPortal(
              <RepoTagPicker
                repo={repo}
                categories={categories}
                onToggleTag={onToggleTag}
                onCreateTag={onCreateTag}
                onClose={() => setShowTagPicker(false)}
                anchorRef={tagAreaRef}
              />,
              document.body
            )}
          </div>

          {/* Note editor */}
          {editingNote && (
            <div className="mt-2" onClick={e => e.stopPropagation()}>
              <textarea
                className="gh-input text-xs resize-none"
                rows={2}
                placeholder="添加备注..."
                value={noteText}
                onChange={e => setNoteText(e.target.value)}
                autoFocus
                onBlur={() => setEditingNote(false)}
              />
            </div>
          )}

          {/* Note display */}
          {!editingNote && repo.note && (
            <div className="mt-1 flex items-start gap-1.5 text-xs text-gh-fgMuted">
              <span className="mt-0.5 flex-shrink-0">📝</span>
              <span className="truncate">{repo.note}</span>
            </div>
          )}
        </div>
      );
    }

    // ── README Panel ───────────────────────────────────────────────────────────
    function ReadmePanel({ repo, onClose }) {
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        setLoading(true);
        const t = setTimeout(() => setLoading(false), 800);
        return () => clearTimeout(t);
      }, [repo?.full_name]);

      if (!repo) return null;

      return (
        <div className="flex flex-col h-full bg-white">
          {/* Header */}
          <div className="flex items-start justify-between p-4 border-b border-gh-borderMuted">
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2 mb-1">
                <h2 className="text-base font-semibold text-gh-accent truncate">{repo.full_name}</h2>
                <a href={`https://github.com/${repo.full_name}`} target="_blank" rel="noopener" className="flex items-center gap-1 text-xs text-gh-fgMuted hover:text-gh-accent flex-shrink-0">
                  在 GitHub 打开 <ExternalIcon />
                </a>
              </div>
              <div className="flex items-center gap-3 text-xs text-gh-fgMuted flex-wrap">
                <span className="flex items-center gap-0.5">
                  <StarIcon filled={true} size={12} />
                  {formatStars(repo.stargazers_count)}
                </span>
                {repo.language && (
                  <span className="flex items-center gap-1">
                    <span className="inline-block w-2.5 h-2.5 rounded-full" style={{ background: getLanguageColor(repo.language) }} />
                    {repo.language}
                  </span>
                )}
                <span>Updated: {repo.updated_at}</span>
              </div>
              {repo.description && (
                <p className="text-xs text-gh-fgMuted mt-1.5">{repo.description}</p>
              )}
            </div>
            <button onClick={onClose} className="p-2 sm:p-1 rounded hover:bg-gh-canvas transition-colors text-gh-fgMuted hover:text-gh-fg ml-2 flex-shrink-0" style={{ minWidth: 44, minHeight: 44, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <CloseIcon />
            </button>
          </div>

          {/* README body */}
          <div className="flex-1 overflow-y-auto">
            {loading ? (
              <div className="p-6 space-y-3">
                <div className="skeleton h-8 w-2/3" />
                <div className="skeleton h-4 w-full" />
                <div className="skeleton h-4 w-5/6" />
                <div className="skeleton h-4 w-4/6" />
                <div className="h-4" />
                <div className="skeleton h-4 w-full" />
                <div className="skeleton h-4 w-3/4" />
                <div className="skeleton h-24 w-full" />

              <div className="absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none"><SearchIcon /></div>

          {/* Tag list */}
          <div className="flex-1 overflow-y-auto p-1" style={{ maxHeight: 280 }}>

                  return (
                    <div
                      key={tag.id}
                      className="tag-toggle-item"

    // ── Simple Markdown Renderer (for prototype) ───────────────────────────────
    function renderSimpleMarkdown(md) {
      let html = md
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>');

      // Code blocks
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        return `<pre><code class="language-${lang}">${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
      });

      // Wrap consecutive <li> in <ul>
      html = html.replace(/(<li>[\s\S]*?<\/li>)/g, (match) => {
        if (!match.startsWith('<ul>')) return '<ul>' + match + '</ul>';
        return match;
      });
      // Clean up nested ul
      html = html.replace(/<\/ul>\s*<ul>/g, '');

      // Paragraphs for lines that aren't already wrapped
      html = html.split('\n').map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '';
        if (trimmed.startsWith('<')) return trimmed;
        return `<p>${trimmed}</p>`;
      }).join('\n');

      return html;
    }

    // ── Main App ───────────────────────────────────────────────────────────────
    function App() {
      const [activeFilter, setActiveFilter] = useState('all');
      const [selectedRepo, setSelectedRepo] = useState(null);
      const [collapsedCats, setCollapsedCats] = useState([]);
      const [sortBy, setSortBy] = useState('starred_at');
      const [sortDir, setSortDir] = useState('desc');
      const [syncing, setSyncing] = useState(false);
      const [toast, setToast] = useState(null);
      const [repos, setRepos] = useState(MOCK_REPOS);
      const [categories, setCategories] = useState(MOCK_CATEGORIES);
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
      const [showTagManager, setShowTagManager] = useState(false);

      // Track viewport size
      useEffect(() => {
        const onResize = () => setIsMobile(window.innerWidth < 768);
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      // Compute tag -> repo count mapping
      const repoCounts = useMemo(() => {
        const counts = {};
        repos.forEach(r => {
          (r.tags || []).forEach(t => {
            counts[t] = (counts[t] || 0) + 1;
          });
        });
        return counts;
      }, [repos]);

      // Filter repos
      const filteredRepos = useMemo(() => {
        let filtered = [...repos];

        if (activeFilter === 'untagged') {
          filtered = filtered.filter(r => !r.tags || r.tags.length === 0);
        } else if (activeFilter.startsWith('cat:')) {
          const catId = activeFilter.slice(4);
          const cat = categories.find(c => c.id === catId);
          if (cat) {
            const tagIds = new Set(cat.tags.map(t => t.id));
            filtered = filtered.filter(r => r.tags?.some(t => tagIds.has(t)));
          }
        } else if (activeFilter.startsWith('tag:')) {
          const tagId = activeFilter.slice(4);
          filtered = filtered.filter(r => r.tags?.includes(tagId));
        }

        // Sort
        filtered.sort((a, b) => {
          let cmp = 0;
          if (sortBy === 'starred_at') cmp = a.starred_at.localeCompare(b.starred_at);
          else if (sortBy === 'stargazers_count') cmp = a.stargazers_count - b.stargazers_count;
          else if (sortBy === 'full_name') cmp = a.full_name.localeCompare(b.full_name);
          else if (sortBy === 'updated_at') cmp = a.updated_at.localeCompare(b.updated_at);
          return sortDir === 'desc' ? -cmp : cmp;
        });

        return filtered;
      }, [repos, categories, activeFilter, sortBy, sortDir]);

      const toggleCat = (catId) => {
        setCollapsedCats(prev =>
          prev.includes(catId) ? prev.filter(id => id !== catId) : [...prev, catId]
        );
      };

      const handleSync = () => {
        setSyncing(true);
        setTimeout(() => {
          setSyncing(false);
          setToast({ message: '同步完成，共 ' + repos.length + ' 个仓库', type: 'success' });
        }, 2000);
      };

      // Close mobile sidebar when selecting a filter
      const handleFilterSelect = (filter) => {
        setActiveFilter(filter);
        if (isMobile) setMobileSidebarOpen(false);
      };

      // Close mobile readme
      const handleCloseReadme = () => {
        setSelectedRepo(null);
      };

      // Toggle a tag on a repo
      const handleToggleTag = (repoFullName, tagId) => {
        setRepos(prev => prev.map(r => {
          if (r.full_name !== repoFullName) return r;
          const tags = r.tags || [];
          const has = tags.includes(tagId);
          return { ...r, tags: has ? tags.filter(t => t !== tagId) : [...tags, tagId] };
        }));
      };

      // Create a new global tag and assign to repo
      const handleCreateTag = (catId, tagName) => {
        const tagId = 'tag_' + tagName.toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');
        // Add to categories
        setCategories(prev => prev.map(cat =>
          cat.id === catId
            ? { ...cat, tags: cat.tags.some(t => t.id === tagId) ? cat.tags : [...cat.tags, { id: tagId, name: tagName, order: cat.tags.length }] }
            : cat
        ));
        setToast({ message: `标签 "${tagName}" 已创建`, type: 'success' });
      };

      return (
        <div className="flex h-screen bg-white overflow-hidden">
          {/* Toast */}
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

          {/* Tag Manager Modal */}
          {showTagManager && (
            <TagManagerModal
              categories={categories}
              onClose={() => setShowTagManager(false)}
              onUpdateCategories={setCategories}
            />
          )}

          {/* Mobile sidebar drawer */}
          {isMobile && (
            <>
              <div
                className={`mobile-sidebar-backdrop ${mobileSidebarOpen ? 'open' : ''}`}
                onClick={() => setMobileSidebarOpen(false)}
              />
              <div className={`mobile-sidebar ${mobileSidebarOpen ? 'open' : ''}`}>
                <CategoryNav
                  categories={categories}
                  activeFilter={activeFilter}
                  onSelectFilter={handleFilterSelect}
                  repoCounts={repoCounts}
                  collapsedCats={collapsedCats}
                  onToggleCat={toggleCat}
                  onOpenTagManager={() => { setShowTagManager(true); setMobileSidebarOpen(false); }}
                  repos={repos}
                />
              </div>
            </>
          )}

          {/* Desktop sidebar */}
          {!isMobile && (
            <div className="flex-shrink-0 border-r border-gh-border bg-gh-canvas/30 overflow-hidden desktop-sidebar" style={{ width: 200 }}>
              <CategoryNav
                categories={categories}
                activeFilter={activeFilter}
                onSelectFilter={setActiveFilter}
                repoCounts={repoCounts}
                collapsedCats={collapsedCats}
                onToggleCat={toggleCat}
                onOpenTagManager={() => setShowTagManager(true)}
                repos={repos}
              />
            </div>
          )}

          {/* Middle Panel: Repo List */}
          <div className="flex flex-col border-r border-gh-border panel-transition overflow-hidden repo-list-panel" style={{ width: (!isMobile && selectedRepo) ? 360 : '100%', minWidth: isMobile ? 0 : 320 }}>
            {/* Toolbar */}
            <div className="flex items-center justify-between px-3 py-2 border-b border-gh-borderMuted bg-white flex-shrink-0" style={{ minHeight: isMobile ? 48 : 40 }}>
              <div className="flex items-center gap-2">
                {isMobile && (
                  <button
                    onClick={() => setMobileSidebarOpen(true)}
                    className="mobile-menu-btn p-2 -ml-1 rounded-md hover:bg-gh-canvas transition-colors"
                    aria-label="打开侧边栏"
                    style={{ minWidth: 44, minHeight: 44, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
                  >
                    <HamburgerIcon />
                  </button>

                {!isMobile && (

                    <SyncIcon spinning={syncing} />
                    <span className="hidden sm:inline">{syncing ? '同步中...' : '同步'}</span>
                  </button>
                )}
                <span className="text-xs text-gh-fgMuted">{filteredRepos.length} 个仓库</span>
              </div>

              >

                <option value="starred_at:asc">Star 时间 ↑</option>
                <option value="stargazers_count:desc">Star 数 ↓</option>
                <option value="stargazers_count:asc">Star 数 ↑</option>
                <option value="full_name:asc">名称 A→Z</option>
                <option value="full_name:desc">名称 Z→A</option>
                <option value="updated_at:desc">更新时间 ↓</option>
                <option value="updated_at:asc">更新时间 ↑</option>
              </select>
            </div>

            {/* Search bar */}
            <div className="px-3 py-2 border-b border-gh-borderMuted bg-white flex-shrink-0">
              <div className="relative">
                <div className="absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"><SearchIcon /></div>
                <input
                  type="text"
                  placeholder="搜索仓库名、描述、标签..."
                  className="gh-input pl-8 text-sm"
                  style={{ height: isMobile ? 36 : 32 }}
                />
              </div>
            </div>

            {/* Repo list */}
            <div className="flex-1 overflow-y-auto" style={{ WebkitOverflowScrolling: 'touch' }}>
              {filteredRepos.map(repo => (
                <RepoCard
                  key={repo.full_name}
                  repo={repo}
                  isSelected={selectedRepo?.full_name === repo.full_name}
                  onClick={() => setSelectedRepo(repo)}
                  categories={categories}
                  onToggleTag={handleToggleTag}
                  onCreateTag={handleCreateTag}
                />
              ))}
              {filteredRepos.length === 0 && (
                <div className="flex flex-col items-center justify-center py-16 text-gh-fgMuted">
                  <svg width="40" height="40" viewBox="0 0 16 16" fill="#d1d9e0" className="mb-3"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
                  <p className="text-sm">没有匹配的仓库</p>
                </div>
              )}
            </div>
          </div>

          {/* Desktop Right Panel: README Viewer */}
          {!isMobile && selectedRepo && (
            <div className="flex-1 overflow-hidden panel-transition bg-white desktop-readme">
              <ReadmePanel
                repo={selectedRepo}
                onClose={handleCloseReadme}
              />
            </div>
          )}

          {/* Mobile README overlay */}
          {isMobile && selectedRepo && (
            <>
              <div
                className="mobile-sidebar-backdrop open"
                onClick={handleCloseReadme}
                style={{ zIndex: 29 }}
              />
              <div className="mobile-readme-overlay open" style={{ zIndex: 30 }}>
                <ReadmePanel
                  repo={selectedRepo}
                  onClose={handleCloseReadme}
                />
              </div>
            </>
          )}
        </div>
      );
    }

    // ── Mount ──────────────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
